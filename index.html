<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">

    <div class="image-box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-poSimzX07uzNYgY2Ps3CuCqQIN4Js1fsAA&s" alt="song image">
    </div>

    <div class="song-info">
        <p class="device">iPhone</p>
        <h2>My Favorite Song</h2>
        <p class="artist">Artist Name — Album Name</p>
    </div>

    <div class="progress">
        <span>00:00</span>
        <div class="bar">
            <div class="fill"></div>
        </div>
        <span class="endTime">00:00</span>
    </div>

    <div class="controls">
        <button class="prevBtn">⏮</button>
        <button class="playPause">⏸</button>
        <button class="nextBtn">⏭</button>
    </div>
<audio id="audio" src="Letsplay.mp3"></audio>

</div>

 <script src="script.js"></script>
</body>
</html>
