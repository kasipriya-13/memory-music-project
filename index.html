<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">

    <div class="image-box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-poSimzX07uzNYgY2Ps3CuCqQIN4Js1fsAA&s" alt="song image">
    </div>

    <div class="song-info">
        <p class="device">iPhone</p>
        <h2>My Favorite Song</h2>
        <p class="artist">Artist Name — Album Name</p>
    </div>

    <div class="progress">
        <span>2:22</span>
        <div class="bar">
            <div class="fill"></div>
        </div>
        <span>-1:08</span>
    </div>

    <div class="controls">
        <button>⏮</button>
        <button class="playPause">⏸</button>
        <button>⏭</button>
    </div>

</div>

 <script src="script.js"></script>
</body>
</html>
